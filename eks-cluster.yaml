apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: netflix-devsecops
  region: us-east-1
  version: '1.32'

vpc:
  clusterEndpoints:
    publicAccess: true
    privateAccess: true
  publicAccessCIDRs: ['YOUR_IP/32']   # restrict API server to your IP only

managedNodeGroups:
  - name: netflix-workers
    instanceType: t3.small
    minSize: 2
    maxSize: 2
    desiredCapacity: 2
    volumeSize: 20
    volumeEncrypted: true
    privateNetworking: true
    disableIMDSv1: true   # forces IMDSv2, blocks SSRF credential theft
    labels:
      role: worker
    tags:
      Project: DevSecOps
      ManagedBy: eksctl
secretsEncryption:
  keyARN: arn:aws:kms:us-east-1:<AWS_ACCOUNT_ID>:key/<APP_KMS_KEY_ID>   # envelope-encrypts K8s Secrets

accessConfig:
  authenticationMode: API_AND_CONFIG_MAP
  accessEntries:
    - principalARN: arn:aws:iam::<AWS_ACCOUNT_ID>:role/EC2-SSM-Role
      accessPolicies:
        - policyARN: arn:aws:eks::aws:cluster-access-policy/AmazonEKSEditPolicy
          accessScope: {type: namespace, namespaces: [default]}

iam:
  withOIDC: true   # Required for IAM service accounts (ALB controller)

addons:
  - name: vpc-cni
    configurationValues: |
      enableNetworkPolicy: "true"
  - name: coredns
  - name: kube-proxy

cloudWatch:
  clusterLogging:
    enableTypes: ['api', 'audit', 'authenticator', 'controllerManager', 'scheduler']
