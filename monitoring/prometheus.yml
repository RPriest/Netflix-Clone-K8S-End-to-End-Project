global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/alert_rules.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'jenkins'
    static_configs:
      - targets: ['<jenkins_private_ip>:9100']

  - job_name: 'defectdojo'
    static_configs:
      - targets: ['<defectdojo_private_ip>:9100']

  - job_name: 'kubernetes-node-exporter'
    static_configs:
      - targets:
          - '<NODE_1_PRIVATE_IP>:<NODE_EXPORTER_NODEPORT>'
          - '<ANY_NODE_PRIVATE_IP>:<NODE_EXPORTER_NODEPORT>'

  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['<ANY_NODE_PRIVATE_IP>:<KUBE_STATE_METRICS_NODEPORT>']
